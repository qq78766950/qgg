# ==============================================================================
#  heiliao.com  ·  Quantumult X 全量去广告规则  (v4 / full)
# ==============================================================================
#
#  【本版做了什么】把之前精简掉的广告屏蔽全部加回来，覆盖站点**全部**广告位：
#    ① 首页/各页列表里「每隔一行」穿插的广告卡
#    ② 自动弹出的弹窗广告（含弹窗内广告九宫格 + 遮罩）
#    ③ 分页「跳转至 __ 页 / GO」下方那条横幅 (b1)
#    ④ 文章详情页正文内的广告位 (c1 / c2 / b2)
#    ⑤ 页面角落的浮窗广告 (float)
#    ⑥ 底部弹出广告条 (.bottom-ads)
#
#  【重要说明 · 第三页缩略图】
#    第 3 页起缩略图不显示，实测结论是**图床自己的风控限流**，与本题规则无关：
#      · 图床 pic.hdhwqx.cn 在瞬时高并发（实测 29 并发）后会短暂对所有请求返回
#        「HTTP 200 + 0 字节」，静置 2-5 分钟自动恢复 → 前端解密失败 → 空白格子。
#      · 用页码直接跳到第 3 页时一屏几十张图同时发起 → 立刻触发风控；
#        前两页是一张张慢慢滚出来的，所以看起来"正常"。
#      · 本规则全程没有拦截过 pic.hdhwqx.cn（mitm / reject / rewrite 都没有），
#        注入的 CSS 实测 0 张正文图被隐藏。改规则无法解决这个问题。
#      → 表现：翻到第 3 页先空白，等 2-5 分钟下拉刷新即恢复，属站点侧现象。
#
#  【原理】两件事配合，缺一不可：
#    (A) 掐掉广告资源：
#        · /static/pgx/slot-ads.js  —— 广告总渲染器（242 条广告创意全在里面），
#          它负责渲染横幅、弹窗、浮窗，并把列表里的广告"空壳"回填成真实广告。
#        · /html/popup-feed.json    —— 底部弹窗广告的配置源。
#    (B) 注入一行 CSS：
#        · 隐藏所有广告位容器；
#        · 关键：JS 被掐后，列表里那些**服务端直出的广告空壳**
#          （<a class="pgx-card" data-card="..."> 没有 href、内含无 src 的 <img>）
#          没人回填了 → 会变成"每隔一行一张裂图"。所以必须把这些空壳连同它
#          所在的整个格子一起隐藏，列表才不会留空洞、不会裂图。
#
#  【为什么不用 [filter_local] 封域名】
#    广告素材域名和正文图**共用同一个图床域名**（pic.hdhwqx.cn），只是路径不同
#    （广告 /hc237/、正文 /upload/）。QX 的 filter 只能按域名匹配、不能按路径，
#    一封就会连正文缩略图一起封掉 —— 这正是之前"裂图"的根源。故本规则完全
#    不使用 filter，全部走「掐路径 + 注 CSS」。
#
#  【用法】
#    把 [rewrite_local] 和 [mitm] 两段并入你的配置即可（无需 [filter_local]）。
#    ⚠️ 需开启「重写(Rewrite)」，并安装 + 信任 Quantumult X 证书（MITM），否则不生效。
#    ⚠️ 站点换新线路域名时，把新域名补进 [mitm] 的 hostname。
# ==============================================================================


[rewrite_local]

# —— (A) 掐广告资源 ——————————————————————————————————————————————
# ① 广告总渲染器：拦掉后横幅/弹窗/浮窗/九宫格全部不再生成
^https?://[^/]+/static/pgx/slot-ads\.js(\?.*)?$ url reject-200

# ② 底部弹窗广告配置源：返回空 JSON，避免前端解析报错
^https?://[^/]+/(?:html/)?popup-feed\.json(\?.*)?$ url reject-dict

# —— (B) 注入 CSS：隐藏全部广告位 + 收拾列表里的广告空壳 ————————————————
#   · 匹配范围：仅 HTML 页面（路径不含扩展名），已排除 static/usr/upload/watch/
#     menu/favicon/html 目录，不会碰 JS / CSS / 图片 / 视频响应体。
#   · 注入位置：</head> 之前（全站每页 </head> 只出现 1 次，不会重复注入）。
#   · 选择器分两组：
#       第 1 组 = 广告容器全隐藏
#           .pgx-slot                   所有广告位（b1/b2/c1/c2/float/pop_notice/pop_grid）
#           .bottom-ads                 底部弹出广告条
#           .component-advertises       弹窗总容器（弹窗 + 遮罩）
#       第 2 组 = 收拾"广告空壳"（JS 被掐后残留的无内容卡片，不收拾就会裂图）
#           a.pgx-card[data-card]:not([href])                        无链接的广告空壳卡
#           img.fill-img:not([z-image-loader-url]):not([src])        空壳卡里没有图源的空图
#           .video-item:has(>a.pgx-card[data-card]:not([href]))      空壳卡所在的整个列表格
#       （`:has()` 需 iOS 15.4+；单独成条，不支持时仅退化为"隐藏卡但留格子"，
#         不会影响其它广告的屏蔽。）
^https?://[^/]+/(?!static/|usr/|upload|watch/|menu|favicon|html/)[^.?#]*(?:[?#]|$) url response-body </head> response-body <style id="qx-noad">.pgx-slot,.bottom-ads,.component-advertises,a.pgx-card[data-card]:not([href]),img.fill-img:not([z-image-loader-url]):not([src]){display:none!important}.video-item:has(>a.pgx-card[data-card]:not([href])){display:none!important}</style></head>


[mitm]
# 需要证书才能改写。%APPEND% = 追加，不会覆盖你原有的 hostname 列表。
hostname = %APPEND% heiliao.com, *.heiliao.com, heiliao88.com, *.heiliao88.com, hlwf26.com, *.hlwf26.com, *.eycegfaf.cc, *.eymzwubd.cc, *.qxrguuar.cc, *.fyqwdrxm.cc, *.oziwczvg.cc, d1enfcu6vnrxba.cloudfront.net
