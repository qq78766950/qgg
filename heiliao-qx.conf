[rewrite_local]
# ---------- 核心 ①：广告渲染器返回空 -> 弹窗/浮层/Banner/浮窗/列表广告卡全部失效 ----------
#   slot-ads.js 是本站广告的唯一渲染器，两类活都归它：
#     · boot() 给所有 .pgx-slot 广告位填内容（Banner / 弹窗 / 网格 / 浮窗）
#     · hydrateCard() 给列表里的 .pgx-card 空壳回填落地页 + 封面图
#   返回空体后两者都不会执行 —— 弹窗不再弹，列表广告卡也不再被"激活"。
^https?://[^/]+/static/pgx/slot-ads\.js url reject-200

# ---------- 核心 ②：底部弹窗配置返回空 JSON -> .bottom-ads 永不生成 ----------
^https?://[^/]+/html/popup-feed\.json url reject-dict
^https?://[^/]+/static/popup-feed\.json url reject-dict

# ---------- 兜底（可选）：广告素材图 ----------
#   广告图全在 pic.hdhwqx.cn/hc237/ 下，正文图在 /upload_01/ 与 /upload/ 下，两者零重叠。
#   但既然 slot-ads.js 已被掐掉，广告图根本不会被请求，所以这条默认不开，
#   以免把整个图片站都拉进 MITM 增加开销。真要开的话，记得同时把 pic.hdhwqx.cn 加进 [mitm]。
;^https?://pic\.hdhwqx\.cn/hc237/ url reject-img

# ---------- 收尾：CSS 收掉「清空后残留的占位框」+「服务端直出的广告卡空壳」----------
#  覆盖两类残留：
#    A. 空广告位：div.pgx-slot（Banner 位带 aspect-ratio:950/2021.3，内容没了会留约
#       2.1 倍宽的空白）、底部弹窗外壳 .bottom-ads
#    B. 列表广告卡空壳（关键修复）：a.pgx-card[data-card] 没有 href，
#       里面的 img.fill-img 既无 z-image-loader-url 也无 src —— 就是那张「无法显示的图片」
#
#  选择器说明（都是精确匹配，不会碰到正文）：
#    a.pgx-card[data-card]:not([href])      只命中未被回填的广告壳；正文卡片类是
#                                           "cursor-pointer" 且一定带 href
#    img.fill-img:not([z-image-loader-url]):not([src])
#                                           实测命中数 = 广告壳数（首页15 / 第2页2 / 其他0），
#                                           正文缩略图 100% 带 z-image-loader-url，零误伤
#  第二条规则用 :has() 把整个网格格位一起收掉，避免留下空白行；
#  :has() 需 iOS 15.4+，不支持时只有这一条失效，上面的规则照常生效。
#
#  注入位置：</head> 之前（全站页面里 </head> 只出现 1 次，不会重复注入）。
#  URL 匹配范围已排除 static/usr/upload/watch/menu/favicon/html 等资源目录，
#  且路径中不含扩展名，所以不会去扫 JS/CSS/图片/视频的响应体。
^https?://[^/]+/(?!static/|usr/|upload|watch/|menu|favicon|html/)[^.?#]*(?:[?#]|$) url response-body </head> response-body <style>div.pgx-slot,.bottom-ads,a.pgx-card[data-card]:not([href]),img.fill-img:not([z-image-loader-url]):not([src]){display:none!important}.video-item:has(>a.pgx-card[data-card]:not([href])){display:none!important}</style></head>


