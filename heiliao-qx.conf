# ==============================================================================
#  heiliao.com 去广告规则  ·  Quantumult X
#  目标：弹窗浮层广告 + 横幅 Banner + 列表内嵌广告卡（首页 / 第2页 / 后续所有页）
#  生成时间：2026-10-13      实测站点：heiliao.com / heiliao88.com / hlwf26.com
#
#  【v2 更新】修复「列表每隔一行就有一张图无法显示」
#    经复核：那不是正文图片被误杀，而是服务端直出的「广告卡空壳」没被隐藏。
#    详见下方 ③ 与 [rewrite_local] 核心 ③ 的注释。
# ==============================================================================
#
#  【为什么这么写】
#  实测（抓取真实 HTML + JS）发现：这个站的广告全部由「同源资源 + 服务端直出空壳」驱动，
#  广告投放域名再怎么轮换都不影响下面的方案。
#
#   ① /static/pgx/slot-ads.js      <- 广告总渲染器（~90KB，广告素材池硬编码在里面）
#        负责：data-slot="b1/b2"  横幅 Banner（950:2021 竖版大图）
#              data-slot="pop_notice" 弹窗浮层
#              data-slot="pop_grid"   首页网格广告
#              data-slot="c1/c2"      详情页上下标签广告
#              "web浮窗广告"、"web弹窗应用中心"
#        广告图全部走 pic.hdhwqx.cn/hc237/...（与正文图完全分离，零重叠）
#
#   ② /html/popup-feed.json        <- 底部弹出弹窗配置，被 bottom_popup_poll.js 拉取
#        渲染出 .bottom-ads.bottom-banner
#
#   ③ 列表内嵌广告卡（服务端直出空壳）<- 这个最容易被误判成「误杀正文图」
#        列表里每隔一个格位就有一个空壳，长这样：
#          <a class="cursor-pointer pgx-card" data-card="54779" data-page_key="index">
#            <div class="video-item-img">…<div class="placeholder-img">
#              <img class="fill-img" alt="黑料网免费吃瓜">   ← 既无 src 也无 z-image-loader-url
#        它的 href 和封面本来由 slot-ads.js 的 hydrateCard() 回填；我们把该 JS 掐掉后
#        没人回填，这个 <img> 就永远无图可显示 → 表现为「每隔一行一张图裂了」。
#        实测首页 30 个格位里 15 个是这种壳（CT / AD 严格交替），第2页 2 个，第3页起为 0。
#        ⚠️ 这不是误杀：正文缩略图走 z-image-loader-url（/upload_01/、/upload/），
#           与广告壳的空 img 完全两回事，且 pic.hdhwqx.cn 从未进入 [mitm]。
#
#  因此策略是「掐资源 + 收空壳」而不是「封域名」：
#    · slot-ads.js        -> 返回空内容（reject-200），所有广告位直接失去内容
#    · popup-feed.json    -> 返回空 JSON（reject-dict），底部弹窗永不出现
#    · HTML 注入一小段 CSS -> 把「清空后残留的占位框」和「服务端直出的广告卡空壳」一起隐藏，
#                             避免 Banner 位留大片空白、列表里留裂图
#
#  【用法】
#    把 [filter_local] / [rewrite_local] / [mitm] 三段分别并入你配置里的同名段落。
#    [mitm] 用了 %APPEND%，不会覆盖你已有的 hostname 列表。
#    ⚠️ 需要开启「重写(Rewrite)」并安装、信任 Quantumult X 的证书（MITM）。
#
#  【维护】
#    站点换新线路域名时，只需把新域名追加到 [mitm] hostname（或改写对应 .cc 通配即可）。
#    这几个特征都是固定实现，通常不需要改：
#      · /static/pgx/slot-ads.js               广告总渲染器（含列表卡回填）
#      · /html/popup-feed.json                 底部弹窗配置
#      · .pgx-slot / .pgx-card[data-card]      广告位与广告卡空壳的类名
#    如果哪天列表又出现"裂图"，先看是不是广告壳换了类名：
#      在页面上长按裂图 → 检查元素，把新类名补进 [rewrite_local] 最后一条的 CSS 里。
# ==============================================================================


