# ==============================================================================
#  heiliao.com  ·  Quantumult X 精简去广告规则  (v3 / minimal)
#  只做两件事：
#    ① 去掉弹窗广告（首页/列表页自动弹出的广告图 + 弹窗里的广告九宫格）
#    ② 去掉「页数（分页）下面」那一条横幅广告
#  其它一律不碰：不封域名、不拦脚本、不动图片、不碰列表卡片。
#
#  实测站点：heiliao.com / heiliao88.com / hlwf26.com 及各级线路域名
# ==============================================================================
#
#  【原理】只往 HTML 里注入一行 CSS，用站点自己的容器名精确命中这两处：
#
#   ① 弹窗广告
#      站点所有弹窗广告都装在同一个容器里：
#          <div class="component-advertises">
#      …里面是 5 个 van-popup 弹窗（4 张弹窗广告图 pgx-slot[data-slot="pop_notice"]
#      + 1 个弹窗内广告九宫格 pgx-slot[data-slot="pop_grid"]），
#      以及弹窗的遮罩层（van-overlay 也在该容器内部）。
#      → 隐藏这个容器：弹窗、遮罩一起消失，干净且无残留。
#
#   ② 页数下面的横幅
#      分页区（"跳转至 __ 页 / GO"）后面紧跟一个广告位：
#          <div class="pgx-slot" data-slot="b1" data-variant="banner"
#               style="aspect-ratio: 950 / 2021.3; margin-bottom: 0.5rem; width: 100%;">
#      → 隐藏它：横幅和它预留的高度一起消失，不会留下大片空白。
#
#  【为什么这么写】
#    这两个容器名/属性是站点自己的固定实现，广告素材怎么轮换都不受影响。
#    因为只隐藏这两个容器，不拦脚本、不拦图片、不封域名：
#      · 不可能误伤正文缩略图（之前"裂图"的根源就是去碰了图片相关的选择器）
#      · 不会留下空白占位框
#    站点上另外还有两处广告（浮窗 float、文章页的 c1/c2/b2 位），按你的要求
#    一律不动。如以后想去掉，文末有说明。
#
#  【用法】
#    把 [rewrite_local] 和 [mitm] 两段并入你的配置即可，不需要 [filter_local]。
#    ⚠️ 需开启「重写(Rewrite)」并安装 + 信任 Quantumult X 证书（MITM），否则不生效。
# ==============================================================================


[rewrite_local]
# 唯一一条规则：给 HTML 页面注入一行 CSS
#   · 匹配范围：只匹配 HTML 页面（路径中不含扩展名），并已排除 static/usr/upload/
#     watch/menu/favicon/html 等资源目录 —— 不会去碰 JS / CSS / 图片 / 视频的响应体。
#   · 注入位置：</head> 之前（全站每个页面 </head> 只出现 1 次，不会重复注入）。
#   · 两个选择器：
#       .component-advertises              弹窗容器（弹窗 + 遮罩）
#       .pgx-slot[data-slot="b1"]          页数下面那条横幅
^https?://[^/]+/(?!static/|usr/|upload|watch/|menu|favicon|html/)[^.?#]*(?:[?#]|$) url response-body </head> response-body <style>.component-advertises,.pgx-slot[data-slot="b1"]{display:none!important}</style></head>


[mitm]
# 需要证书才能改写。%APPEND% = 追加，不会覆盖你原有的 hostname 列表。
# 站点换新线路域名时，把新域名（或它的根域通配）加到这里即可。
hostname = %APPEND% heiliao.com, *.heiliao.com, heiliao88.com, *.heiliao88.com, hlwf26.com, *.hlwf26.com, *.eycegfaf.cc, *.eymzwubd.cc, *.qxrguuar.cc, *.fyqwdrxm.cc, *.oziwczvg.cc, d1enfcu6vnrxba.cloudfront.net


# ==============================================================================
#  【可选】以下都不是本次要求，默认不做。需要时再把对应选择器加进上面的 CSS 里。
#    .pgx-slot[data-slot="float"]   浮窗广告（页面角落的悬浮按钮）
#    .pgx-slot[data-slot="c1"],
#    .pgx-slot[data-slot="c2"],
#    .pgx-slot[data-slot="b2"]      文章详情页内的广告位
# ==============================================================================
